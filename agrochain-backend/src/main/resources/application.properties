# AgroChain — Spring Boot application configuration
spring.application.name=agrochain-backend

# Server
server.port=8080
server.servlet.context-path=/api

# Local H2 file database (stored in agrochain-backend/data/)
spring.datasource.url=jdbc:h2:file:./data/agrochain;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 web console — open http://localhost:8080/api/h2-console (admin login required)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Flyway disabled — Oracle migrations are not used with local H2
spring.flyway.enabled=false

# JWT (use strong secrets in production)
app.jwt.secret=${JWT_SECRET:AgroChainDevSecretKeyMustBeAtLeast256BitsLongForHS256AlgorithmSecurity}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.auth.reset-token-expiry-minutes=${APP_AUTH_RESET_TOKEN_EXPIRY_MINUTES:30}

# Demo data seeder (roles + sample users/products/orders)
app.seed.enabled=true

# Logging
logging.level.com.agrochain=INFO
logging.level.org.springframework.security=INFO
